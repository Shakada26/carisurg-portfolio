# CariSurg triage-acuity pipeline — single source of truth.
# One decision, one model, one set of hyperparameters (Task 1).
# Change a value here, not in the code, to re-run with different settings.

seed: 42

data:
  raw_path: "data/yaleemmlc_admissionprediction_triage.csv"
  test_size: 0.2
  drop_demographics: true
  drop_admin: true

features:
  add_clinical_features: true
  add_demographics: false

# ---- PINNED FINAL MODEL (the Week 7 recommendation) ----
model:
  name: "gradient_boosting"
  params:
    max_depth: 6
    learning_rate: 0.1
    max_iter: 300
    class_weight: "balanced"
    random_state: 42

output:
  model_path: "models/final_model.joblib"